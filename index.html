<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manada · red social de perros</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<style>
:root{--bg:#fbf6ef;--card:#fff;--ink:#2b2420;--mut:#6f635a;--acc:#c85a17;--accs:#fde6d6;--ok:#1f7a50;--oks:#d9f2e5;--line:#eadfd2;--oa:#fff;color-scheme:light light}
@media(prefers-color-scheme:dark){:root{--bg:#1b1714;--card:#262019;--ink:#f3ebe3;--mut:#b2a498;--acc:#f08a4b;--accs:#3d2a1d;--ok:#5cc791;--oks:#17382a;--line:#3a3128;--oa:#1b1714;color-scheme:dark}}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:24px;margin:8px 0}h2{margin:6px 0}h3{margin:18px 0 4px}.m,small{color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:110px;background:none;border:0;color:var(--mut);font:12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button span{font-size:22px}nav .on{color:var(--acc);font-weight:700}
button{cursor:pointer;font:inherit}button:disabled{opacity:.5}
.p{width:100%;background:var(--acc);color:var(--oa);border:0;border-radius:12px;padding:12px;font-weight:600;margin:10px 0}.p.s{width:auto;padding:8px 12px;margin:0}
.g{background:none;border:0;color:var(--acc);padding:8px 0}
.c{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;margin:0 6px 6px 0}.c.on{background:var(--acc);color:var(--oa);border-color:var(--acc)}
.b{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}.b.g{background:var(--oks);color:var(--ok)}.b.w{background:var(--accs);color:var(--acc)}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.box{margin-top:40px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.row>div:nth-child(2){flex:1}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accs);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.pt{display:flex;gap:10px;align-items:center;margin-bottom:8px}.pt small{margin-left:auto}
img.ph{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin:6px 0}
label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.fb{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:6px 12px;margin:8px 8px 0 0;font-size:13px;cursor:pointer}
.lk{background:none;border:0;color:var(--mut);padding:4px 0}
.cm{font-size:13px;margin:2px 0}.cm b{font-weight:600}
#msg{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:9;max-width:90%}
</style></head><body>
<div id="msg"></div><div id="app"></div>
<nav style="display:none"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://bomtwozfngeaivgdcmgl.supabase.co","sb_publishable_TbvB0r5ti6azpLKww79BCg_ZzAO-tjL");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let U,M,tab="mu",soloV=0;
const hoy=new Date().toISOString().slice(0,10);
const fecha=s=>new Date(s.length==10?s+"T12:00":s).toLocaleDateString("es-AR",{day:"numeric",month:"short"});
const msg=t=>{const e=$("#msg");e.textContent=t;e.style.display=t?"block":"none";if(t)setTimeout(()=>msg(""),4500)};
const q=async p=>{const r=await p;if(r.error)msg(r.error.message);return r};
const av=u=>u?`<img class="av" src="${esc(u)}" alt="">`:`<div class="av">🐶</div>`;
const sello=o=>`<span class="b ${o?"g":"w"}">${o?"✓ Vacunas al día":"Vacunas en curso"}</span>`;
const comp=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.8)};i.src=URL.createObjectURL(f)});
async function up(f){if(!f)return null;const b=await comp(f),p=U.id+"/"+Date.now()+".jpg",{error}=await sb.storage.from("fotos").upload(p,b,{contentType:"image/jpeg"});if(error){msg(error.message);return null}return sb.storage.from("fotos").getPublicUrl(p).data.publicUrl}

const AU=()=>`<div class="box"><h1>🐾 Manada</h1><p class="m">Prueba cerrada: lo que cargues lo ven los demás participantes.</p><label>Tu nombre<input id="nm"></label><label>Email<input id="em" type="email"></label><label>Contraseña (mínimo 6)<input id="pw" type="password"></label><button class="p" data-a="in">Entrar</button><button class="g" data-a="reg">Crear cuenta</button></div>`;
const SU=()=>`<div class="box"><h1>Tu perro</h1><label>Nombre<input id="sn"></label><label>Raza<input id="sr"></label><label>Sexo<select id="ss"><option>macho</option><option>hembra</option></select></label><label>Tamaño<select id="st"><option>chico</option><option selected>mediano</option><option>grande</option></select></label><label>Cumpleaños<input id="sc" type="date"></label><label>Foto<input id="sf" type="file" accept="image/*"></label><button class="p" data-a="sv">Guardar</button></div>`;

async function muro(){
const {data:P,error}=await sb.from("publicaciones").select("*,mascotas(nombre,foto_url),me_gusta(perfil_id),comentarios(texto,perfiles(nombre))").order("creado_en",{ascending:false}).limit(30);
if(error)return `<p class="m">${esc(error.message)}</p>`;
return `<div class="card"><input id="tx" placeholder="¿Qué hizo ${esc(M.nombre)} hoy?"><label class="fb">📷 Foto<input id="ft" type="file" accept="image/*" style="display:none"></label><span id="fn" class="m"></span><button class="p" data-a="pub">Publicar</button></div>`+
(P.length?P.map(p=>{const l=p.me_gusta||[],on=l.some(x=>x.perfil_id==U.id);
return `<div class="card"><div class="pt">${av(p.mascotas?.foto_url)}<b>${esc(p.mascotas?.nombre)}</b><small>${fecha(p.creado_en)}</small></div>${p.foto_url?`<img class="ph" src="${esc(p.foto_url)}" alt="">`:""}${p.texto?`<p>${esc(p.texto)}</p>`:""}<button class="lk" data-a="lk" data-v="${p.id}" data-on="${on?1:0}">${on?"❤️":"🤍"} ${l.length}</button>${(p.comentarios||[]).map(c=>`<div class="cm"><b>${esc(c.perfiles?.nombre)}:</b> ${esc(c.texto)}</div>`).join("")}<div class="row"><input id="c${p.id}" placeholder="Comentar"><button class="p s" data-a="cm" data-v="${p.id}">Enviar</button></div></div>`}).join(""):`<p class="m">Todavía no hay publicaciones. ¡Hacé la primera!</p>`)}

async function expl(){
const [a,b,c]=await Promise.all([sb.from("mascotas").select("*").neq("dueno_id",U.id),sb.from("mascota_vacunas").select("*"),sb.from("vinculos").select("*")]);
const vs=Object.fromEntries((b.data||[]).map(x=>[x.mascota_id,x.al_dia])),vn=c.data||[],L=(a.data||[]).filter(d=>!soloV||vs[d.id]);
return `<div><button class="c ${soloV?"on":""}" data-a="fv">✓ Solo vacunas al día</button></div>`+(L.length?L.map(d=>{
const v=vn.find(x=>(x.mascota_a==M.id&&x.mascota_b==d.id)||(x.mascota_b==M.id&&x.mascota_a==d.id));
const bt=!v?`<button class="p s" data-a="con" data-v="${d.id}">Conectar</button>`:v.estado=="aceptado"?`<span class="b g">Conectados</span>`:v.mascota_b==M.id?`<button class="p s" data-a="ac" data-v="${v.id}">Aceptar</button>`:`<small>Solicitud enviada</small>`;
return `<div class="card row">${av(d.foto_url)}<div><b>${esc(d.nombre)}</b><br><small>${esc(d.raza||"")} · ${esc(d.tamano||"")}</small><br>${sello(vs[d.id])}</div><div>${bt}</div></div>`}).join(""):`<p class="m">Todavía no hay otros perros. Invitá a tus vecinos.</p>`)}

async function perfil(){
const {data:V}=await sb.from("vacunas").select("*").eq("mascota_id",M.id),Z=V||[],ok=Z.length>0&&Z.every(x=>!x.proxima_dosis||x.proxima_dosis>=hoy);
return `<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${av(M.foto_url)}</div><h2>${esc(M.nombre)}</h2><small>${esc(M.raza||"")}${M.fecha_nacimiento?" · 🎂 "+fecha(M.fecha_nacimiento):""}</small><br>${sello(ok)}</div><h3>Vacunas</h3>`+
Z.map(x=>`<div class="card row"><div><b>${esc(x.tipo)}</b><br><small>Próxima dosis: ${x.proxima_dosis||"—"}</small></div><button class="g" data-a="dv" data-v="${x.id}">✕</button></div>`).join("")+
`<div class="card"><label>Vacuna<input id="vt" placeholder="Ej: Antirrábica"></label><label>Próxima dosis<input id="vp" type="date"></label><button class="p" data-a="va">Agregar vacuna</button></div><button class="g" data-a="out">Cerrar sesión</button>`}

async function go(t){tab=t;$("nav").innerHTML=[["mu","🏠","Muro"],["ex","🔎","Explorar"],["pf","🐶","Perfil"]].map(([k,i,n])=>`<button class="${tab==k?"on":""}" data-a="tab" data-v="${k}"><span>${i}</span>${n}</button>`).join("");
$("#app").innerHTML=`<p class="m">Cargando…</p>`;$("#app").innerHTML=await({mu:muro,ex:expl,pf:perfil}[t])()}
async function init(s){U=s?.user;const n=$("nav");
if(!U){$("#app").innerHTML=AU();n.style.display="none";return}
const {data}=await sb.from("mascotas").select("*").eq("dueno_id",U.id).limit(1);M=data?.[0];
if(!M){$("#app").innerHTML=SU();n.style.display="none";return}
n.style.display="flex";go(tab)}
sb.auth.onAuthStateChange((e,s)=>{if(["INITIAL_SESSION","SIGNED_IN","SIGNED_OUT"].includes(e))setTimeout(()=>init(s),0)});

const A={
async in(){const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error)msg(error.message)},
async reg(){const{data,error}=await sb.auth.signUp({email:$("#em").value.trim(),password:$("#pw").value,options:{data:{nombre:$("#nm").value.trim()}}});if(error)return msg(error.message);if(!data.session)msg("Revisá tu mail para confirmar la cuenta.")},
async out(){await sb.auth.signOut()},
async sv(){const n=$("#sn").value.trim();if(!n)return msg("Falta el nombre");const u=await up($("#sf").files[0]);
const r=await q(sb.from("mascotas").insert({dueno_id:U.id,nombre:n,raza:$("#sr").value.trim()||null,sexo:$("#ss").value,tamano:$("#st").value,fecha_nacimiento:$("#sc").value||null,foto_url:u}));if(!r.error)init({user:U})},
tab(v){tab=v},fv(){soloV=!soloV},
async pub(){const f=$("#ft").files[0],t=$("#tx").value.trim();if(!t&&!f)return;await q(sb.from("publicaciones").insert({mascota_id:M.id,autor_id:U.id,texto:t||null,foto_url:await up(f)}))},
async lk(v,b){await q(b.dataset.on=="1"?sb.from("me_gusta").delete().match({publicacion_id:v,perfil_id:U.id}):sb.from("me_gusta").insert({publicacion_id:v,perfil_id:U.id}))},
async cm(v){const x=$("#c"+v).value.trim();if(x)await q(sb.from("comentarios").insert({publicacion_id:v,autor_id:U.id,texto:x}))},
async con(v){await q(sb.from("vinculos").insert({mascota_a:M.id,mascota_b:v}))},
async ac(v){await q(sb.from("vinculos").update({estado:"aceptado"}).eq("id",v))},
async va(){const t=$("#vt").value.trim();if(t)await q(sb.from("vacunas").insert({mascota_id:M.id,tipo:t,aplicada_el:hoy,proxima_dosis:$("#vp").value||null}))},
async dv(v){await q(sb.from("vacunas").delete().eq("id",v))}};
document.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;b.disabled=true;await A[a](b.dataset.v,b);b.disabled=false;if(!["in","reg","out","sv"].includes(a))go(tab)};
document.onchange=e=>{if(e.target.id=="ft")$("#fn").textContent="✓ "+(e.target.files[0]?.name||"")};
</script></body></html>
